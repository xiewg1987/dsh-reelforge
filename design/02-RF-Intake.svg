<svg xmlns="http://www.w3.org/2000/svg" width="560" height="900" viewBox="0 0 560 900">
  <rect x="0" y="0" width="560" height="900" fill="#0B0E14"/>

  <!-- ============ HEADER 0..60 ============ -->
  <rect x="0" y="0" width="560" height="60" fill="#171A20"/>
  <rect x="0" y="59" width="560" height="1" fill="#23262B"/>
  <rect x="20" y="16" width="28" height="28" rx="8" fill="#4C8DFF"/>
  <rect x="488" y="19" width="52" height="22" rx="6" fill="#1F2127"/>

  <!-- ============ STAGEBAR 60..110  当前步=需求 ============ -->
  <rect x="0" y="60" width="560" height="50" fill="#12151B"/>
  <rect x="12" y="74" width="56" height="22" rx="6" fill="#16203A"/>
  <rect x="0" y="109" width="560" height="1" fill="#23262B"/>

  <!-- ============ SCROLL 110..830 ============ -->
  <!-- 来源卡 -->
  <rect x="20" y="126" width="520" height="144" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="432" y="136" width="96" height="20" rx="4" fill="#1F2127"/>

  <!-- 章节预览卡 -->
  <rect x="20" y="282" width="520" height="170" rx="10" fill="#12151B" stroke="#23262B" stroke-width="1"/>

  <!-- 项目设置卡 -->
  <rect x="20" y="464" width="520" height="180" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>

  <!-- 待确认卡 -->
  <rect x="20" y="656" width="520" height="98" rx="10" fill="#16203A"/>

  <!-- 滚动条 -->
  <rect x="548" y="126" width="3" height="160" rx="1.5" fill="#2D3035"/>

  <!-- ============ FOOTER 830..900 ============ -->
  <rect x="0" y="830" width="560" height="70" fill="#171A20"/>
  <rect x="0" y="830" width="560" height="1" fill="#23262B"/>
  <rect x="436" y="846" width="104" height="32" rx="8" fill="#4C8DFF"/>

  <!-- ============ 圆点 / 图标 ============ -->
  <circle cx="24" cy="85" r="3.5" fill="#4C8DFF"/>
  <circle cx="100" cy="85" r="3.5" fill="#2D3035"/>
  <circle cx="176" cy="85" r="3.5" fill="#2D3035"/>
  <circle cx="252" cy="85" r="3.5" fill="#2D3035"/>
  <circle cx="328" cy="85" r="3.5" fill="#2D3035"/>
  <circle cx="404" cy="85" r="3.5" fill="#2D3035"/>
  <polygon points="30,22 30,38 40,30" fill="#FFFFFF"/>
  <circle cx="36" cy="180" r="3.5" fill="#3FB950"/>
  <circle cx="36" cy="204" r="3.5" fill="#3FB950"/>
  <circle cx="36" cy="228" r="3.5" fill="#3FB950"/>
  <circle cx="38" cy="332" r="9" fill="#16203A"/>
  <circle cx="38" cy="372" r="9" fill="#16203A"/>
  <circle cx="38" cy="412" r="9" fill="#16203A"/>

  <!-- ============ 文字 ============ -->
  <!-- HEADER -->
  <text x="60" y="31" font-family="Noto Sans SC" font-size="15" fill="#F2F5F9">导入小说</text>
  <text x="60" y="49" font-family="Noto Sans SC" font-size="11" fill="#5B6472">粘贴正文，ReelForge 自动拆章</text>
  <text x="514" y="34" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">新项目</text>

  <!-- STAGEBAR -->
  <text x="34" y="89" font-family="Noto Sans SC" font-size="11" fill="#F2F5F9">需求</text>
  <text x="109" y="89" font-family="Noto Sans SC" font-size="11" fill="#5B6472">运行</text>
  <text x="185" y="89" font-family="Noto Sans SC" font-size="11" fill="#5B6472">方案</text>
  <text x="261" y="89" font-family="Noto Sans SC" font-size="11" fill="#5B6472">生成</text>
  <text x="337" y="89" font-family="Noto Sans SC" font-size="11" fill="#5B6472">分镜</text>
  <text x="413" y="89" font-family="Noto Sans SC" font-size="11" fill="#5B6472">交付</text>
  <text x="540" y="89" text-anchor="end" font-family="Inter" font-size="11" fill="#5B6472">1 / 6</text>

  <!-- 来源卡 -->
  <text x="32" y="150" font-family="Noto Sans SC" font-size="12" fill="#8A93A5">小说正文</text>
  <text x="480" y="150" text-anchor="middle" font-family="Noto Sans SC" font-size="10" fill="#8A93A5">已粘贴 48,210 字</text>
  <text x="48" y="184" font-family="Noto Sans SC" font-size="10" fill="#5B6472">第 1 章 雨夜码头</text>
  <text x="48" y="208" font-family="Noto Sans SC" font-size="10" fill="#5B6472">第 2 章 灯塔</text>
  <text x="48" y="232" font-family="Noto Sans SC" font-size="10" fill="#5B6472">第 3 章 归港</text>
  <text x="32" y="254" font-family="Noto Sans SC" font-size="10" fill="#5B6472">识别到 3 个「第N章」标题 → 拆为 3 章；无标题时按 6000 字兜底均分</text>

  <!-- 章节预览卡 -->
  <text x="32" y="306" font-family="Noto Sans SC" font-size="12" fill="#8A93A5">自动拆章预览</text>
  <text x="38" y="336" text-anchor="middle" font-family="Inter" font-size="11" fill="#4C8DFF">1</text>
  <text x="38" y="376" text-anchor="middle" font-family="Inter" font-size="11" fill="#8A93A5">2</text>
  <text x="38" y="416" text-anchor="middle" font-family="Inter" font-size="11" fill="#8A93A5">3</text>
  <text x="56" y="336" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">第 1 章 雨夜码头</text>
  <text x="56" y="376" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">第 2 章 灯塔</text>
  <text x="56" y="416" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">第 3 章 归港</text>
  <text x="440" y="336" text-anchor="end" font-family="Noto Sans SC" font-size="11" fill="#4C8DFF">继续</text>
  <text x="528" y="336" text-anchor="end" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">8 镜 · 约 40s</text>
  <text x="528" y="376" text-anchor="end" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">8 镜 · 约 40s</text>
  <text x="528" y="416" text-anchor="end" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">8 镜 · 约 40s</text>
  <text x="32" y="440" font-family="Noto Sans SC" font-size="10" fill="#5B6472">章节标题正则：第N章 / 第N节 / Chapter N</text>

  <!-- 项目设置卡 -->
  <text x="32" y="488" font-family="Noto Sans SC" font-size="12" fill="#8A93A5">项目设置</text>
  <text x="32" y="518" font-family="Noto Sans SC" font-size="10" fill="#5B6472">画幅</text>
  <text x="286" y="518" font-family="Noto Sans SC" font-size="10" fill="#5B6472">分辨率</text>
  <text x="32" y="540" font-family="Inter" font-size="12" fill="#F2F5F9">9:16</text>
  <text x="286" y="540" font-family="Inter" font-size="12" fill="#F2F5F9">1080P</text>
  <text x="32" y="562" font-family="Noto Sans SC" font-size="10" fill="#5B6472">可选 1:1 / 2:3 / 3:2 / 3:4 / 4:3 / 9:16 / 16:9 / 21:9</text>
  <text x="32" y="600" font-family="Noto Sans SC" font-size="10" fill="#5B6472">目标时长</text>
  <text x="286" y="600" font-family="Inter" font-size="10" fill="#5B6472">BGM</text>
  <text x="32" y="622" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">不限（按章）</text>
  <text x="286" y="622" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">开启</text>

  <!-- 待确认卡 -->
  <text x="32" y="680" font-family="Noto Sans SC" font-size="12" fill="#4C8DFF">助手提出的待确认项</text>
  <text x="32" y="708" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">结局按小说原样改编，还是开放式收尾？</text>
  <text x="32" y="734" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">旁白保留还是转成角色独白？</text>
  <text x="528" y="708" text-anchor="end" font-family="Noto Sans SC" font-size="11" fill="#4C8DFF">回答</text>
  <text x="528" y="734" text-anchor="end" font-family="Noto Sans SC" font-size="11" fill="#4C8DFF">回答</text>

  <text x="20" y="778" font-family="Noto Sans SC" font-size="11" fill="#5B6472">正文只做内容解析，不会被当作指令执行</text>

  <!-- FOOTER -->
  <text x="20" y="862" font-family="Noto Sans SC" font-size="11" fill="#5B6472">下一步</text>
  <text x="20" y="884" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">选运行位置：本地还是云端</text>
  <text x="488" y="866" text-anchor="middle" font-family="Noto Sans SC" font-size="12" fill="#FFFFFF">继续</text>
</svg>
