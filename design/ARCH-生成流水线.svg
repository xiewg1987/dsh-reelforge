  <!-- ============ FOOTER 632..688 ============ -->
  <rect x="40" y="632" width="1120" height="56" rx="8" fill="#16203A"/>
  <text x="56" y="656" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">画板顺序 == 用户流程顺序 · 架构图与界面稿共用同一套编号，两边对得上</text>
  <text x="56" y="676" font-family="Noto Sans SC" font-size="10" fill="#5B6472">对应文档 §10.6 · 可编辑源文件 design/ARCH-生成流水线.svg · 降级矩阵见画板 16</text>
