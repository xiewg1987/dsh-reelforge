  <rect x="20" y="16" width="28" height="28" rx="8" fill="#4C8DFF"/>
  <rect x="452" y="19" width="88" height="22" rx="6" fill="#16203A"/>
  <!-- STAGEBAR 60..110 -->
  <rect x="0" y="60" width="560" height="50" fill="#12151B"/>
  <rect x="240" y="74" width="56" height="22" rx="6" fill="#16203A"/>
  <rect x="0" y="109" width="560" height="1" fill="#23262B"/>
  <!-- GROUP 1 按钮 -->
  <rect x="20" y="126" width="254" height="152" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="32" y="162" width="53" height="30" rx="8" fill="#4C8DFF"/>
  <rect x="91" y="162" width="53" height="30" rx="8" fill="#1F2127" stroke="#2D3035" stroke-width="1"/>
  <rect x="150" y="162" width="53" height="30" rx="8" fill="#2D3035"/>
  <rect x="209" y="162" width="53" height="30" rx="8" fill="#F85149"/>
  <rect x="32" y="210" width="230" height="1" fill="#23262B"/>
  <!-- GROUP 2 输入框 -->
  <rect x="286" y="126" width="254" height="152" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="298" y="162" width="74" height="30" rx="8" fill="#12151B" stroke="#2D3035" stroke-width="1"/>
  <rect x="376" y="162" width="74" height="30" rx="8" fill="#12151B" stroke="#4C8DFF" stroke-width="1"/>
  <rect x="454" y="162" width="74" height="30" rx="8" fill="#12151B" stroke="#F85149" stroke-width="1"/>
  <rect x="298" y="210" width="230" height="1" fill="#23262B"/>
  <!-- GROUP 3 胶囊标签 -->
  <rect x="20" y="286" width="254" height="152" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="32" y="325" width="53" height="24" rx="12" fill="#16203A"/>
  <rect x="91" y="325" width="53" height="24" rx="12" fill="#1F2127"/>
  <rect x="150" y="325" width="53" height="24" rx="12" fill="#2A1618"/>
  <rect x="209" y="325" width="53" height="24" rx="12" fill="#1F2127"/>
  <rect x="32" y="370" width="230" height="1" fill="#23262B"/>
  <!-- GROUP 4 进度条 -->
  <rect x="286" y="286" width="254" height="152" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="298" y="326" width="74" height="8" rx="4" fill="#1F2127"/>
  <rect x="298" y="326" width="44" height="8" rx="4" fill="#4C8DFF"/>
  <rect x="376" y="326" width="74" height="8" rx="4" fill="#1F2127"/>
  <rect x="376" y="326" width="74" height="8" rx="4" fill="#3FB950"/>
  <rect x="454" y="326" width="74" height="8" rx="4" fill="#1F2127"/>
  <rect x="454" y="326" width="30" height="8" rx="4" fill="#F85149"/>
  <rect x="298" y="370" width="230" height="1" fill="#23262B"/>
  <!-- GROUP 5 空态 -->
  <rect x="20" y="446" width="254" height="152" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="32" y="482" width="110" height="30" rx="8" fill="#1F2127"/>
  <rect x="150" y="482" width="110" height="30" rx="8" fill="#2A1618"/>
  <rect x="32" y="530" width="230" height="1" fill="#23262B"/>
  <!-- GROUP 6 Toast -->
  <rect x="286" y="446" width="254" height="152" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="298" y="482" width="74" height="30" rx="8" fill="#1F2127" stroke="#2D3035" stroke-width="1"/>
  <rect x="376" y="482" width="74" height="30" rx="8" fill="#2A2214"/>
  <rect x="454" y="482" width="74" height="30" rx="8" fill="#2A1618"/>
  <rect x="298" y="530" width="230" height="1" fill="#23262B"/>
  <!-- GROUP 7 卡片（通栏，避免两列 7 组留空洞） -->
  <rect x="20" y="606" width="520" height="152" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="32" y="638" width="148" height="44" rx="8" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="206" y="638" width="148" height="44" rx="8" fill="#16203A" stroke="#4C8DFF" stroke-width="1"/>
  <rect x="380" y="638" width="148" height="44" rx="8" fill="#2D3035"/>
  <rect x="32" y="690" width="496" height="1" fill="#23262B"/>
  <!-- 底部提示条 -->
  <rect x="20" y="770" width="520" height="56" rx="8" fill="#16203A"/>
  <!-- 滚动条 -->
  <rect x="548" y="126" width="3" height="150" rx="1.5" fill="#2D3035"/>
  <!-- FOOTER 830..900 -->
  <rect x="0" y="830" width="560" height="70" fill="#171A20"/>
  <rect x="0" y="830" width="560" height="1" fill="#23262B"/>
  <rect x="436" y="846" width="104" height="32" rx="8" fill="#4C8DFF"/>

  <!-- ============ CIRCLES / POLYGONS ============ -->
  <polygon points="30,22 30,38 40,30" fill="#FFFFFF"/>
  <circle cx="464" cy="30" r="3.5" fill="#4C8DFF"/>
  <circle cx="24" cy="85" r="3.5" fill="#3FB950"/>
  <circle cx="100" cy="85" r="3.5" fill="#3FB950"/>
  <circle cx="176" cy="85" r="3.5" fill="#3FB950"/>
  <circle cx="252" cy="85" r="3.5" fill="#4C8DFF"/>
  <circle cx="328" cy="85" r="3.5" fill="#2D3035"/>
  <circle cx="404" cy="85" r="3.5" fill="#2D3035"/>
  <circle cx="50" cy="497" r="6" fill="#5B6472"/>
  <circle cx="168" cy="497" r="6" fill="#F85149"/>
  <circle cx="310" cy="497" r="3" fill="#4C8DFF"/>
  <circle cx="388" cy="497" r="3" fill="#D29922"/>
  <circle cx="466" cy="497" r="3" fill="#F85149"/>
  <circle cx="44" cy="798" r="4" fill="#4C8DFF"/>

  <!-- ============ TEXTS ============ -->
  <!-- HEADER -->
  <text x="60" y="31" font-family="Noto Sans SC" font-size="15" fill="#F2F5F9">组件状态</text>
  <text x="60" y="49" font-family="Noto Sans SC" font-size="11" fill="#5B6472">全部态一览</text>
  <text x="474" y="34" font-family="Noto Sans SC" font-size="11" fill="#4C8DFF">7 组组件</text>
  <!-- STAGEBAR -->
  <text x="33" y="89" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">需求</text>
  <text x="109" y="89" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">运行</text>
  <text x="185" y="89" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">方案</text>
  <text x="262" y="89" font-family="Noto Sans SC" font-size="11" fill="#F2F5F9">生成</text>
  <text x="337" y="89" font-family="Noto Sans SC" font-size="11" fill="#5B6472">分镜</text>
  <text x="413" y="89" font-family="Noto Sans SC" font-size="11" fill="#5B6472">交付</text>
  <text x="540" y="89" text-anchor="end" font-family="Inter" font-size="11" fill="#5B6472">4 / 6</text>
  <!-- GROUP 1 按钮 -->
  <text x="32" y="148" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">按钮</text>
  <text x="58" y="181" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#FFFFFF">主要</text>
  <text x="117" y="181" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#F2F5F9">次要</text>
  <text x="176" y="181" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#5B6472">禁用</text>
  <text x="235" y="181" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#FFFFFF">危险</text>
  <text x="32" y="238" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">主 / 次 / 禁 / 危 四态</text>
  <text x="32" y="258" font-family="Noto Sans SC" font-size="10" fill="#5B6472">禁用 #2D3035 · 危险 #F85149</text>
  <!-- GROUP 2 输入框 -->
  <text x="298" y="148" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">输入框</text>
  <text x="308" y="181" font-family="Noto Sans SC" font-size="11" fill="#5B6472">默认</text>
  <text x="386" y="181" font-family="Noto Sans SC" font-size="11" fill="#F2F5F9">聚焦</text>
  <text x="464" y="181" font-family="Noto Sans SC" font-size="11" fill="#F85149">错误</text>
  <text x="298" y="238" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">默认 / 聚焦 / 错误</text>
  <text x="298" y="258" font-family="Noto Sans SC" font-size="10" fill="#5B6472">聚焦描边 #4C8DFF · 错误描边 #F85149</text>
  <!-- GROUP 3 胶囊标签 -->
  <text x="32" y="308" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">胶囊标签</text>
  <text x="58" y="341" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#4C8DFF">进行中</text>
  <text x="117" y="341" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#3FB950">已完成</text>
  <text x="176" y="341" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#F85149">失败</text>
  <text x="235" y="341" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#5B6472">排队</text>
  <text x="32" y="398" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">进行中 / 已完成 / 失败 / 排队</text>
  <text x="32" y="418" font-family="Noto Sans SC" font-size="10" fill="#5B6472">胶囊高 24 · 圆角 12</text>
  <!-- GROUP 4 进度条 -->
  <text x="298" y="308" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">进度条</text>
  <text x="298" y="352" font-family="Inter" font-size="10" fill="#5B6472">RUNNING</text>
  <text x="376" y="352" font-family="Inter" font-size="10" fill="#5B6472">DONE</text>
  <text x="454" y="352" font-family="Inter" font-size="10" fill="#5B6472">FAILED</text>
  <text x="298" y="398" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">进行中 / 完成 / 失败</text>
  <text x="298" y="418" font-family="Noto Sans SC" font-size="10" fill="#5B6472">失败段用 #F85149 · 轨道 #1F2127</text>
  <!-- GROUP 5 空态 -->
  <text x="32" y="468" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">空态</text>
  <text x="64" y="501" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">无数据</text>
  <text x="182" y="501" font-family="Noto Sans SC" font-size="11" fill="#F85149">出错了</text>
  <text x="32" y="558" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">无数据 / 出错了</text>
  <text x="32" y="578" font-family="Noto Sans SC" font-size="10" fill="#5B6472">空态给下一步，不说「暂无」</text>
  <!-- GROUP 6 Toast -->
  <text x="298" y="468" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">Toast</text>
  <text x="320" y="501" font-family="Noto Sans SC" font-size="11" fill="#F2F5F9">信息</text>
  <text x="398" y="501" font-family="Noto Sans SC" font-size="11" fill="#D29922">警告</text>
  <text x="476" y="501" font-family="Noto Sans SC" font-size="11" fill="#F85149">错误</text>
  <text x="298" y="558" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">信息 / 警告 / 错误</text>
  <text x="298" y="578" font-family="Noto Sans SC" font-size="10" fill="#5B6472">右上浮出 · 4s 自动消失</text>
  <!-- GROUP 7 卡片 -->
  <text x="32" y="628" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">卡片</text>
  <text x="528" y="628" text-anchor="end" font-family="Noto Sans SC" font-size="11" fill="#5B6472">选中态用 #4C8DFF 描边</text>
  <text x="44" y="658" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">默认</text>
  <text x="44" y="676" font-family="Inter" font-size="10" fill="#5B6472">#23262B</text>
  <text x="218" y="658" font-family="Noto Sans SC" font-size="11" fill="#4C8DFF">选中</text>
  <text x="218" y="676" font-family="Inter" font-size="10" fill="#5B6472">#4C8DFF</text>
  <text x="392" y="658" font-family="Noto Sans SC" font-size="11" fill="#5B6472">禁用</text>
  <text x="392" y="676" font-family="Inter" font-size="10" fill="#5B6472">#2D3035</text>
  <text x="32" y="718" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">卡片三态：默认描边 / 选中高亮 / 禁用实色</text>
  <text x="32" y="738" font-family="Noto Sans SC" font-size="10" fill="#5B6472">禁用态不响应点击，但内容仍要可读</text>
  <!-- 底部提示条 -->
  <text x="60" y="802" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">状态色只用令牌色 · 不用透明度表达层级</text>
  <!-- FOOTER -->
  <text x="20" y="862" font-family="Noto Sans SC" font-size="11" fill="#5B6472">组件规范</text>
  <text x="20" y="884" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">禁用态用实色 #2D3035，不用 opacity</text>
  <text x="488" y="866" text-anchor="middle" font-family="Noto Sans SC" font-size="12" fill="#FFFFFF">导出组件表</text>
</svg>
