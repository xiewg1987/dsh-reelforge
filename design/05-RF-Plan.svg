  <text x="528" y="526" text-anchor="end" font-family="Noto Sans SC" font-size="10" fill="#5B6472">本地与云端是同一 kind 的两套 sourceFile，不是两档能力</text>

  <text x="32" y="546" font-family="Inter" font-size="11" fill="#4C8DFF">t2i</text>
