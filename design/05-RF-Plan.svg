  <text x="298" y="202" font-family="Noto Sans SC" font-size="13" fill="#F2F5F9">云端 · 图像</text>
  <text x="298" y="226" font-family="Noto Sans SC" font-size="11" fill="#5B6472">托管工作流</text>
  <text x="298" y="258" font-family="Noto Sans SC" font-size="10" fill="#5B6472">2 套 t2i / i2i 规格 · 按次计费</text>
