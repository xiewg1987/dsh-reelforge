  <text x="298" y="392" font-family="Noto Sans SC" font-size="11" fill="#5B6472">RunningHub standard</text>
  <text x="298" y="424" font-family="Noto Sans SC" font-size="10" fill="#5B6472">2 套 r2v 规格 · 按次计费</text>
  <text x="298" y="440" font-family="Inter" font-size="10" fill="#5B6472">cloud_h3_r2v</text>
