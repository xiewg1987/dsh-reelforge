  <!-- 左下：本地 · 视频 -->
  <rect x="20" y="336" width="254" height="150" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="230" y="348" width="32" height="20" rx="4" fill="#1F2127"/>
  <rect x="32" y="406" width="230" height="1" fill="#23262B"/>
  <rect x="32" y="450" width="230" height="24" rx="4" fill="#2A2214"/>
