  <text x="413" y="156" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#5B6472">视频 r2v / tts / music</text>

  <!-- 左上：本地 · 图像 -->
  <rect x="20" y="170" width="254" height="150" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="230" y="182" width="32" height="20" rx="4" fill="#1F2127"/>
  <rect x="32" y="240" width="230" height="1" fill="#23262B"/>
  <rect x="32" y="284" width="230" height="24" rx="4" fill="#1F2127"/>
