  <text x="342" y="703" font-family="Inter" font-size="10" fill="#8A93A5">0.62</text>
  <text x="32" y="719" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">成本</text>
  <text x="284" y="719" font-family="Inter" font-size="10" fill="#8A93A5">0.48</text>

  <text x="20" y="790" font-family="Noto Sans SC" font-size="11" fill="#5B6472">评分是参考，选择权在执行矩阵</text>
