  <text x="32" y="226" font-family="Noto Sans SC" font-size="11" fill="#5B6472">你的 ComfyUI 工作流</text>
  <text x="32" y="258" font-family="Noto Sans SC" font-size="10" fill="#5B6472">2 套 t2i / i2i 规格</text>
  <text x="32" y="274" font-family="Inter" font-size="10" fill="#5B6472">local_sdxl_t2i · local_ipadapter_i2i</text>
  <text x="44" y="300" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">无按次计费</text>

  <!-- 右上：云端 · 图像 -->
  <rect x="286" y="170" width="254" height="150" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="496" y="182" width="32" height="20" rx="4" fill="#1F2127"/>
  <rect x="298" y="240" width="230" height="1" fill="#23262B"/>
  <rect x="298" y="284" width="230" height="24" rx="4" fill="#16203A"/>
