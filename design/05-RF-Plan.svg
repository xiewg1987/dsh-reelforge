  <!-- 右下：云端 · 视频（选中） -->
  <rect x="286" y="336" width="254" height="150" rx="10" fill="#171A20" stroke="#4C8DFF" stroke-width="1"/>
  <rect x="496" y="348" width="32" height="20" rx="4" fill="#16203A"/>
  <rect x="298" y="406" width="230" height="1" fill="#23262B"/>
  <rect x="298" y="450" width="230" height="24" rx="4" fill="#16203A"/>
