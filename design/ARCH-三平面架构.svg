  <text x="56" y="458" font-family="Noto Sans SC" font-size="10" fill="#5B6472">7 页签 · 面板自建滚动容器</text>

  <rect x="40" y="486" width="300" height="52" rx="8" fill="#12151B"/>
  <text x="56" y="508" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">Tab kind 一经发布不可改名</text>
  <text x="56" y="526" font-family="Noto Sans SC" font-size="10" fill="#5B6472">TAB_ID 可改 · kind 不可改</text>

