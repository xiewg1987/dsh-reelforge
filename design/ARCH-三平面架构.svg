  <rect x="40" y="132" width="300" height="76" rx="8" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <text x="56" y="156" font-family="Noto Sans SC" font-size="13" fill="#F2F5F9">DSH 会话</text>
