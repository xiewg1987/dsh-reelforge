  <text x="466" y="548" font-family="Noto Sans SC" font-size="10" fill="#5B6472">单条 / 整批 / 按时间点 · 漂移保护</text>
  <text x="466" y="566" font-family="Noto Sans SC" font-size="10" fill="#5B6472">媒体二进制不随回滚删除</text>

