  <text x="32" y="732" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">参考图优先级：服装 &gt; 年龄变体 &gt; 角色原图（独立维度，不叠加）</text>
  <text x="32" y="752" font-family="Noto Sans SC" font-size="10" fill="#5B6472">同一镜里同时指定服装与年龄时，按服装取图</text>

