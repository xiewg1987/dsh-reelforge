<svg xmlns="http://www.w3.org/2000/svg" width="560" height="900" viewBox="0 0 560 900">
  <rect x="0" y="0" width="560" height="900" fill="#0B0E14"/>

  <!-- ============ HEADER 0..60 ============ -->
  <rect x="0" y="0" width="560" height="60" fill="#171A20"/>
  <rect x="0" y="59" width="560" height="1" fill="#23262B"/>
  <rect x="20" y="16" width="28" height="28" rx="8" fill="#4C8DFF"/>
  <polygon points="30,22 30,38 40,30" fill="#FFFFFF"/>
  <text x="60" y="31" font-family="Noto Sans SC" font-size="15" fill="#F2F5F9">上下文</text>
  <text x="60" y="49" font-family="Noto Sans SC" font-size="11" fill="#5B6472">一致性锚点：圣经 / 风格 / 连续性</text>
  <rect x="452" y="19" width="88" height="22" rx="6" fill="#16203A"/>
  <circle cx="464" cy="30" r="3.5" fill="#4C8DFF"/>
  <text x="474" y="34" font-family="Noto Sans SC" font-size="11" fill="#4C8DFF">3 个分区</text>

  <!-- ============ STAGEBAR 60..110 ============ -->
  <rect x="0" y="60" width="560" height="50" fill="#12151B"/>
  <circle cx="24" cy="85" r="3.5" fill="#3FB950"/>
  <text x="33" y="89" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">需求</text>
  <circle cx="100" cy="85" r="3.5" fill="#3FB950"/>
  <text x="109" y="89" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">运行</text>
  <circle cx="176" cy="85" r="3.5" fill="#3FB950"/>
  <text x="185" y="89" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">方案</text>
  <rect x="240" y="74" width="56" height="22" rx="6" fill="#16203A"/>
  <circle cx="252" cy="85" r="3.5" fill="#4C8DFF"/>
  <text x="262" y="89" font-family="Noto Sans SC" font-size="11" fill="#F2F5F9">生成</text>
  <circle cx="328" cy="85" r="3.5" fill="#2D3035"/>
  <text x="337" y="89" font-family="Noto Sans SC" font-size="11" fill="#5B6472">分镜</text>
  <circle cx="404" cy="85" r="3.5" fill="#2D3035"/>
  <text x="413" y="89" font-family="Noto Sans SC" font-size="11" fill="#5B6472">交付</text>
  <text x="540" y="89" text-anchor="end" font-family="Inter" font-size="11" fill="#5B6472">4 / 6</text>
  <rect x="0" y="109" width="560" height="1" fill="#23262B"/>

  <!-- ============ SCROLL 110..830 ============ -->
  <!-- 分区一 · bible -->
  <rect x="20" y="126" width="520" height="196" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="472" y="138" width="56" height="20" rx="4" fill="#1F2127"/>
  <text x="32" y="152" font-family="Noto Sans SC" font-size="12" fill="#8A93A5">人物圣经 bible</text>
  <text x="500" y="152" text-anchor="middle" font-family="Noto Sans SC" font-size="10" fill="#8A93A5">整段覆盖</text>
  <text x="32" y="178" font-family="Noto Sans SC" font-size="13" fill="#F2F5F9">夜航船 · 人物圣经</text>
  <text x="32" y="198" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">· 林岸：38 岁，码头调度员，深灰夹克</text>
  <text x="32" y="216" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">· 苏晚：26 岁，灯塔守夜人，红色围巾</text>
  <text x="32" y="234" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">· 常驻锚点：左撇子 / 右手疤 / 围巾红色</text>
  <text x="32" y="252" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">· 场景站位表：码头栈桥 1 号位，灯塔 2 号位</text>
  <text x="32" y="302" font-family="Noto Sans SC" font-size="10" fill="#D29922">bible 必须含「场景站位表」：空间锚点 + 角色默认方位 + 180° 轴线</text>

  <!-- 分区二 · style -->
  <rect x="20" y="338" width="520" height="128" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="472" y="350" width="56" height="20" rx="4" fill="#1F2127"/>
  <text x="32" y="364" font-family="Noto Sans SC" font-size="12" fill="#8A93A5">风格指南 style</text>
  <text x="500" y="364" text-anchor="middle" font-family="Noto Sans SC" font-size="10" fill="#8A93A5">整段覆盖</text>
  <text x="32" y="386" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">· 冷调写实 · 低饱和 · 胶片颗粒</text>
  <text x="32" y="406" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">· 夜景光源：钠灯偏橙，天空偏青</text>
  <text x="32" y="426" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">· 全片禁止：正脸特写死光、高饱和霓虹</text>
  <text x="32" y="448" font-family="Noto Sans SC" font-size="10" fill="#5B6472">style 整段覆盖：换风格等于换掉全片调性，已产出镜头不重跑</text>

  <!-- 分区三 · continuity -->
  <rect x="20" y="482" width="520" height="184" rx="10" fill="#171A20" stroke="#23262B" stroke-width="1"/>
  <rect x="492" y="494" width="36" height="20" rx="4" fill="#2A2214"/>
  <text x="32" y="508" font-family="Noto Sans SC" font-size="12" fill="#8A93A5">连续性记录 continuity</text>
  <text x="484" y="508" text-anchor="end" font-family="Noto Sans SC" font-size="10" fill="#5B6472">只追加，不覆盖</text>
  <text x="510" y="508" text-anchor="middle" font-family="Noto Sans SC" font-size="10" fill="#D29922">追加</text>
  <text x="32" y="530" font-family="Inter" font-size="10" fill="#5B6472">00:12</text>
  <text x="72" y="530" font-family="Noto Sans SC" font-size="11" fill="#F2F5F9">第 1 章  林岸外套湿透</text>
  <text x="32" y="554" font-family="Inter" font-size="10" fill="#5B6472">02:40</text>
  <text x="72" y="554" font-family="Noto Sans SC" font-size="11" fill="#F2F5F9">第 2 章  苏晚换下围巾</text>
  <text x="32" y="578" font-family="Inter" font-size="10" fill="#5B6472">05:05</text>
  <text x="72" y="578" font-family="Noto Sans SC" font-size="11" fill="#F2F5F9">第 2 章  围巾再次出现</text>
  <text x="32" y="650" font-family="Noto Sans SC" font-size="10" fill="#5B6472">continuity 以 {时间, 内容} 追加，生成时按时间点注入</text>

  <!-- 注入说明条 -->
  <rect x="20" y="682" width="520" height="56" rx="8" fill="#16203A"/>
  <text x="32" y="706" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">注入标题固定：「人物圣经」「风格指南」「连续性记录」</text>
  <text x="32" y="724" font-family="Noto Sans SC" font-size="10" fill="#5B6472">写入前先读回再合并，不覆盖已有人物与衣橱</text>

  <text x="20" y="772" font-family="Noto Sans SC" font-size="11" fill="#5B6472">上下文只允许三个键，多写的键一律报错不静默丢弃</text>
  <rect x="548" y="126" width="3" height="150" rx="1.5" fill="#2D3035"/>

  <!-- ============ FOOTER 830..900 ============ -->
  <rect x="0" y="830" width="560" height="70" fill="#171A20"/>
  <rect x="0" y="830" width="560" height="1" fill="#23262B"/>
  <text x="20" y="862" font-family="Noto Sans SC" font-size="11" fill="#5B6472">下一步</text>
  <text x="20" y="884" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">生成资产参考图</text>
  <rect x="436" y="846" width="104" height="32" rx="8" fill="#4C8DFF"/>
  <text x="488" y="866" text-anchor="middle" font-family="Noto Sans SC" font-size="12" fill="#FFFFFF">继续</text>
</svg>
