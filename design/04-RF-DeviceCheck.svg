<svg xmlns="http://www.w3.org/2000/svg" width="560" height="900" viewBox="0 0 560 900">
  <rect x="0" y="0" width="560" height="900" fill="#0B0E14"/>

  <!-- ============ HEADER 0..60 ============ -->
  <rect x="0" y="0" width="560" height="60" fill="#171A20"/>
  <rect x="0" y="59" width="560" height="1" fill="#23262B"/>
  <rect x="20" y="16" width="28" height="28" rx="8" fill="#4C8DFF"/>
  <polygon points="30,22 30,38 40,30" fill="#FFFFFF"/>
  <text x="60" y="31" font-family="Noto Sans SC" font-size="15" fill="#F2F5F9">设备检查</text>
  <text x="60" y="49" font-family="Noto Sans SC" font-size="11" fill="#5B6472">本地档要过 9 项探测</text>
  <rect x="452" y="19" width="88" height="22" rx="6" fill="#1F2127"/>
  <circle cx="464" cy="30" r="3.5" fill="#3FB950"/>
  <text x="474" y="34" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">9 项探测</text>

  <!-- ============ STAGEBAR 60..110 ============ -->
  <rect x="0" y="60" width="560" height="50" fill="#12151B"/>
  <circle cx="24" cy="85" r="3.5" fill="#3FB950"/>
  <text x="33" y="89" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">需求</text>
  <rect x="88" y="74" width="56" height="22" rx="6" fill="#16203A"/>
  <circle cx="100" cy="85" r="3.5" fill="#4C8DFF"/>
  <text x="110" y="89" font-family="Noto Sans SC" font-size="11" fill="#F2F5F9">运行</text>
  <circle cx="176" cy="85" r="3.5" fill="#2D3035"/>
  <text x="185" y="89" font-family="Noto Sans SC" font-size="11" fill="#5B6472">方案</text>
  <circle cx="252" cy="85" r="3.5" fill="#2D3035"/>
  <text x="261" y="89" font-family="Noto Sans SC" font-size="11" fill="#5B6472">生成</text>
  <circle cx="328" cy="85" r="3.5" fill="#2D3035"/>
  <text x="337" y="89" font-family="Noto Sans SC" font-size="11" fill="#5B6472">分镜</text>
  <circle cx="404" cy="85" r="3.5" fill="#2D3035"/>
  <text x="413" y="89" font-family="Noto Sans SC" font-size="11" fill="#5B6472">交付</text>
  <text x="540" y="89" text-anchor="end" font-family="Inter" font-size="11" fill="#5B6472">2 / 6</text>
  <rect x="0" y="109" width="560" height="1" fill="#23262B"/>

  <!-- ============ SCROLL 110..830 ============ -->
  <!-- 检测状态条 -->
  <rect x="20" y="126" width="520" height="56" rx="10" fill="#12151B"/>
  <circle cx="40" cy="150" r="4" fill="#3FB950"/>
  <rect x="424" y="138" width="104" height="26" rx="6" fill="#1F2127" stroke="#2D3035" stroke-width="1"/>
  <text x="56" y="154" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">检测完成 · 9 项 · 用时 4.1s</text>
  <text x="56" y="170" font-family="Noto Sans SC" font-size="10" fill="#5B6472">探测结果只落在插件状态，不写进会话日志</text>
  <text x="476" y="155" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">重新检测</text>

  <!-- 本地档 9 行探测 -->
  <text x="20" y="206" font-family="Noto Sans SC" font-size="12" fill="#8A93A5">本地档探测项</text>
  <rect x="20" y="220" width="520" height="30" rx="8" fill="#171A20"/>
  <rect x="20" y="258" width="520" height="30" rx="8" fill="#171A20"/>
  <rect x="20" y="296" width="520" height="30" rx="8" fill="#171A20"/>
  <rect x="20" y="334" width="520" height="30" rx="8" fill="#171A20"/>
  <rect x="20" y="372" width="520" height="30" rx="8" fill="#171A20"/>
  <rect x="20" y="410" width="520" height="30" rx="8" fill="#171A20"/>
  <rect x="20" y="448" width="520" height="30" rx="8" fill="#171A20"/>
  <rect x="20" y="486" width="520" height="30" rx="8" fill="#171A20"/>
  <rect x="20" y="524" width="520" height="30" rx="8" fill="#171A20"/>
  <circle cx="372" cy="235" r="3.5" fill="#3FB950"/>
  <circle cx="372" cy="273" r="3.5" fill="#3FB950"/>
  <circle cx="372" cy="311" r="3.5" fill="#F85149"/>
  <circle cx="372" cy="349" r="3.5" fill="#3FB950"/>
  <circle cx="372" cy="387" r="3.5" fill="#3FB950"/>
  <circle cx="372" cy="425" r="3.5" fill="#3FB950"/>
  <circle cx="372" cy="463" r="3.5" fill="#3FB950"/>
  <circle cx="372" cy="501" r="3.5" fill="#3FB950"/>
  <circle cx="372" cy="539" r="3.5" fill="#3FB950"/>

  <text x="32" y="240" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">ComfyUI 可达</text>
  <text x="152" y="240" font-family="Inter" font-size="10" fill="#5B6472">GET :8188/system_stats</text>
  <text x="384" y="240" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">已启动</text>
  <text x="528" y="240" text-anchor="end" font-family="Inter" font-size="10" fill="#5B6472">v0.3.12</text>

  <text x="32" y="278" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">CK 版本</text>
  <text x="152" y="278" font-family="Inter" font-size="10" fill="#5B6472">comfy-kitchen</text>
  <text x="384" y="278" font-family="Inter" font-size="12" fill="#F2F5F9">0.2.41</text>
  <text x="528" y="278" text-anchor="end" font-family="Inter" font-size="10" fill="#5B6472">≥ 0.2.36</text>

  <text x="32" y="316" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">显存</text>
  <text x="152" y="316" font-family="Inter" font-size="10" fill="#5B6472">nvidia-smi</text>
  <text x="384" y="316" font-family="Inter" font-size="12" fill="#F85149">6.0 GB</text>
  <text x="528" y="316" text-anchor="end" font-family="Noto Sans SC" font-size="10" fill="#D29922">门槛 8 GB</text>

  <text x="32" y="354" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">GPU</text>
  <text x="152" y="354" font-family="Inter" font-size="10" fill="#5B6472">nvidia-smi</text>
  <text x="384" y="354" font-family="Inter" font-size="12" fill="#F2F5F9">RTX 4070</text>
  <text x="528" y="354" text-anchor="end" font-family="Inter" font-size="10" fill="#5B6472">nvidia</text>

  <text x="32" y="392" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">ffmpeg</text>
  <text x="152" y="392" font-family="Inter" font-size="10" fill="#5B6472">ffmpeg -version</text>
  <text x="384" y="392" font-family="Inter" font-size="12" fill="#F2F5F9">6.1</text>
  <text x="528" y="392" text-anchor="end" font-family="Noto Sans SC" font-size="10" fill="#5B6472">在 PATH</text>

  <text x="32" y="430" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">编码器</text>
  <text x="152" y="430" font-family="Inter" font-size="10" fill="#5B6472">ffmpeg -encoders</text>
  <text x="384" y="430" font-family="Inter" font-size="12" fill="#F2F5F9">h264 / aac</text>
  <text x="528" y="430" text-anchor="end" font-family="Noto Sans SC" font-size="10" fill="#5B6472">无 nvenc</text>

  <text x="32" y="468" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">磁盘余量</text>
  <text x="152" y="468" font-family="Noto Sans SC" font-size="10" fill="#5B6472">卷可用空间</text>
  <text x="384" y="468" font-family="Inter" font-size="12" fill="#F2F5F9">128 GB</text>
  <text x="528" y="468" text-anchor="end" font-family="Inter" font-size="10" fill="#5B6472">D:</text>

  <text x="32" y="506" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">LLM 通道</text>
  <text x="152" y="506" font-family="Noto Sans SC" font-size="10" fill="#5B6472">DSH 会话</text>
  <text x="384" y="506" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">已连接</text>
  <text x="528" y="506" text-anchor="end" font-family="Noto Sans SC" font-size="10" fill="#5B6472">阶段一可用</text>

  <text x="32" y="544" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">provider 规格</text>
  <text x="152" y="544" font-family="Inter" font-size="10" fill="#5B6472">workflows/specs</text>
  <text x="384" y="544" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">16 套</text>
  <text x="528" y="544" text-anchor="end" font-family="Noto Sans SC" font-size="10" fill="#5B6472">本地 8 / 云端 8</text>

  <!-- 结论 -->
  <rect x="20" y="566" width="520" height="116" rx="10" fill="#2A1618"/>
  <circle cx="40" cy="590" r="5" fill="#F85149"/>
  <rect x="32" y="642" width="120" height="28" rx="8" fill="#4C8DFF"/>
  <rect x="162" y="642" width="120" height="28" rx="8" fill="#1F2127" stroke="#2D3035" stroke-width="1"/>
  <text x="56" y="594" font-family="Noto Sans SC" font-size="13" fill="#F85149">显存不足，本地档只能跑到 image 阶段</text>
  <text x="32" y="614" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">video 阶段需 8GB 显存，当前 6GB</text>
  <text x="32" y="634" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">video 硬依赖 image，可降级为「出图 + 静帧成片」</text>
  <text x="92" y="660" text-anchor="middle" font-family="Noto Sans SC" font-size="10" fill="#FFFFFF">改用云端运行</text>
  <text x="222" y="660" text-anchor="middle" font-family="Noto Sans SC" font-size="10" fill="#8A93A5">只跑到 image 阶段</text>

  <!-- 本地仍可完成 -->
  <text x="20" y="710" font-family="Noto Sans SC" font-size="11" fill="#5B6472">本地仍可完成</text>
  <rect x="112" y="694" width="88" height="24" rx="4" fill="#1F2127"/>
  <rect x="212" y="694" width="88" height="24" rx="4" fill="#1F2127"/>
  <rect x="312" y="694" width="140" height="24" rx="4" fill="#1F2127"/>
  <text x="156" y="710" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">分镜表</text>
  <text x="256" y="710" text-anchor="middle" font-family="Noto Sans SC" font-size="11" fill="#8A93A5">参考图</text>
  <text x="382" y="710" text-anchor="middle" font-family="Noto Sans SC" font-size="10" fill="#8A93A5">成片合成（需 ffmpeg）</text>

  <text x="20" y="754" font-family="Noto Sans SC" font-size="11" fill="#5B6472">探测项与 §7.1 逐条对应；显存不足是明说，不是静默降级</text>
  <rect x="548" y="126" width="3" height="150" rx="1.5" fill="#2D3035"/>

  <!-- ============ FOOTER 830..900 ============ -->
  <rect x="0" y="830" width="560" height="70" fill="#171A20"/>
  <rect x="0" y="830" width="560" height="1" fill="#23262B"/>
  <text x="20" y="862" font-family="Noto Sans SC" font-size="11" fill="#5B6472">下一步</text>
  <text x="20" y="884" font-family="Noto Sans SC" font-size="12" fill="#F2F5F9">按探测结果出执行路径</text>
  <rect x="436" y="846" width="104" height="32" rx="8" fill="#4C8DFF"/>
  <text x="488" y="866" text-anchor="middle" font-family="Noto Sans SC" font-size="12" fill="#FFFFFF">继续</text>
